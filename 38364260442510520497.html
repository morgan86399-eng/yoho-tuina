    <!-- Lightbox Modal -->
    <div id="lightbox-overlay" onclick="closeLightbox(event)">
        <span id="lightbox-close" onclick="closeLightbox(event)">&times;</span>
        <img id="lightbox-img" src="" alt="Zoomed View" onclick="event.stopPropagation()" />
    </div>

    <script>
    // Mobile navigation toggle
    document.addEventListener('DOMContentLoaded', function() {
        var mobileOpen = document.getElementById('mobile-open');
        var mobileClose = document.getElementById('mobile-close');
        
        if (mobileOpen) {
            mobileOpen.addEventListener('click', function(e) {
                e.stopPropagation();
                document.body.classList.toggle('menu-open');
            });
        }
        if (mobileClose) {
            mobileClose.addEventListener('click', function(e) {
                e.stopPropagation();
                document.body.classList.remove('menu-open');
            });
        }
        document.addEventListener('click', function(e) {
            if (document.body.classList.contains('menu-open')) {
                var nav = document.getElementById('navigation');
                if (nav && !nav.contains(e.target) && e.target !== mobileOpen) {
                    document.body.classList.remove('menu-open');
                }
            }
        });
    });

    // Lightbox modal logic
    function openLightbox(src) {
        var overlay = document.getElementById('lightbox-overlay');
        var img = document.getElementById('lightbox-img');
        img.src = src;
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox(e) {
        var overlay = document.getElementById('lightbox-overlay');
        overlay.classList.remove('active');
        document.body.style.overflow = '';
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeLightbox();
        }
    });

    // Bind all lightbox images
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('a[rel="lightbox"], .clickable-img').forEach(function(el) {
            el.addEventListener('click', function(e) {
                e.preventDefault();
                var targetSrc = el.getAttribute('href') || el.getAttribute('src');
                if (targetSrc) {
                    openLightbox(targetSrc);
                }
            });
        });
    });
    </script>
